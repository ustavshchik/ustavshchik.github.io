<!doctype html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evening service guides</title>
  <style>
    @import url('https://fonts.cdnfonts.com/css/minion-pro');
    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: #e8e6e1;
      color: #171615
    }

    header,
    .controls,
    #status {
      font: 14px/1.4 system-ui, sans-serif
    }

    header,
    .controls {
      background: #fdfcf9;
      border-bottom: 1px solid #ccc7bd;
      padding: 10px 22px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px
    }

    h1 {
      font: 600 21px Minion Pro, Georgia, serif;
      margin: 0 auto 0 0
    }

    button,
    select {
      font: inherit;
      padding: 5px 9px;
      border: 1px solid #bfb9ae;
      border-radius: 4px;
      background: white;
      color: #292520
    }

    button {
      cursor: pointer
    }

    button:disabled {
      opacity: .5;
      cursor: default
    }

    #print {
      background: #6d2529;
      color: white
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 6px
    }

    #status {
      margin: 10px 22px
    }

    .sheet {
      background: white;
      width: 11in;
      height: 8.5in;
      margin: 16px auto;
      display: grid;
      grid-template-columns: repeat(2, 50%);
      position: relative;
      box-shadow: 0 2px 9px #0002
    }

    .sheet::after {
      content: "";
      position: absolute;
      left: 50%;
      top: .5in;
      bottom: .5in;
      border-left: 1px dashed #444;
      pointer-events: none
    }

    .panel {
      height: 8.5in;
      padding: .40in .33in;
      display: grid;
      grid-template: minmax(0, 1fr) / minmax(0, 1fr);
      place-items: center
    }

    .frame {
      width: 100%;
      min-height: 75%;
      max-height: 100%;
      position: relative;
      padding: .27in .42in .35in;
      font-family: "Minion Pro", "Palatino", serif;
      font-weight: 500;
      font-size: var(--body-size, 12pt);
      line-height: var(--leading, 1.22);
      color: black
    }

    .border {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .flow {
      position: relative;
      overflow-wrap: anywhere
    }

    .rows {
      display: grid;
      gap: var(--gap, 8pt)
    }

    .day {
      display: block;
      text-align: right;
      font-weight: 600;
      font-size: .74em;
      margin-right: -.10in;
      position: relative;
      top: 2pt;
      /* margin-top: .06in; */
    }

    .heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: .04in
    }

    h2 {
      font-size: 1.13em;
      margin: 0;
      text-decoration: underline;
      text-decoration-skip-ink: none;
      text-align: center
    }

    .note,
    .cue {
      color: #bb1016;
      font-style: italic;
      font-weight: 500;
    }

    .note {
      font-size: .74em
    }

    .cue {
      padding-left: .48in;
      font-size: .85em
    }

    .rubric {
      color: #bb1016
    }

    .divider {
      display: block;
      width: 100%;
      height: auto;
      margin-inline: auto
    }

    [contenteditable] {
      white-space: pre-wrap;
      min-width: 0;
      min-height: 1em
    }

    [contenteditable]:focus {
      outline: 1px dashed #a79a80;
      outline-offset: 2px
    }

    [hidden] {
      display: none !important
    }

    .panel[data-overflow] .frame {
      outline: 2px solid #c21e26
    }

    @page {
      size: letter landscape;
      margin: 0
    }

    @media print {
      body {
        background: white;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact
      }

      header,
      .controls,
      #status {
        display: none
      }

      .sheet {
        margin: 0;
        box-shadow: none;
        break-inside: avoid
      }

      .sheet+.sheet {
        break-before: page
      }

      [contenteditable]:focus {
        outline: 0
      }
    }

    sup.ordinal {
      font-family: inherit;
      font-size: 0.7em;
      line-height: 0;
      vertical-align: super;
    }
  </style>
</head>

<body>
  <header>
    <h1>Evening service guides</h1><button id="save">Save editable copy</button><button id="print">Print guides</button>
  </header>
  <div class="controls" aria-label="Service options">
    <button type="button" id="bold" title="Bold (Ctrl+B or ⌘B)"
      aria-keyshortcuts="Control+B Meta+B"><b>Bold</b></button>
    <label>Editing <select id="service"></select></label>
    <label>Lord, I Call <select data-ending="0">
        <option value="separate">Separate ending</option>
        <option value="combined">Combined ending</option>
      </select></label>
    <label>Aposticha <select data-ending="1">
        <option value="separate">Separate ending</option>
        <option value="combined">Combined ending</option>
      </select></label>
    <button id="add">Add verse</button><button id="remove">Remove last verse</button>
    <label>Divider <select id="ornament">
        <option value="line">Line 1</option>
        <option value="bar">Bar 16</option>
      </select></label>
  </div>
  <p id="status" role="status"></p>
  <main id="sheets"></main>

  <template id="service-template">
    <div class="frame">
      <div class="flow">
        <div class="day" contenteditable="true" aria-label="Service name"></div>
        <div class="rows">
          <div class="heading"><span class="note">After Great Litany (No Kathisma):</span>
            <h2>Lord, I Call</h2>
          </div>
          <div>In the 5th Tone, Lord, I call upon Thee; Hear me!</div>
          <div class="cue">…</div>
          <div class="rubric">Read through Verse (6)</div>
          <div class="cue">…</div>
          <div><span class="rubric">On (3):</span> <span>In the 4th Tone…</span></div>
          <div class="cue">…</div>
          <div class="ending rows"></div>
          <div class="ornaments"></div>
          <div class="heading"><span class="note">After the prayer of Bowing:</span>
            <h2>Aposticha</h2>
          </div>
          <div>In the 5th Tone, O Lord, once in the days of Moses the Prophet.</div>
          <div class="cue">Sticheron</div>
          <div class="verses rows"></div>
          <div class="ending rows"></div>
        </div>
      </div>
    </div>
  </template>
  <script>
    'use strict';
    const $ = (selector, root = document) => root.querySelector(selector);
    const all = (selector, root = document) => [...root.querySelectorAll(selector)];
    const art = $('#art').content;
    const service = $('#service');
    const statusLine = $('#status');
    // All measurements use the print layout, including while editing on screen.
    const limits = { preferredPt: 12, minimumPt: 10, maxGapPt: 8, minGapPt: 2, maxLeading: 1.22, minLeading: 1.05 };
    function field(text, kind = '') {
      const element = document.createElement('div');
      element.contentEditable = 'true';
      element.className = kind;
      element.textContent = text;
      return element;
    }
    const binderCue = 'Verse from binder';
    function colorVerse(text) {
      text.classList.toggle('rubric', text.innerText.trim() === binderCue);
    }
    function addVerse(panel) {
      const pair = document.createElement('div');
      pair.className = 'pair rows';
      const line = document.createElement('div');
      const mark = document.createElement('span');
      mark.className = 'rubric';
      mark.textContent = '℣.';
      const text = document.createElement('span');
      text.className = 'verse-text rubric';
      text.contentEditable = 'true';
      text.textContent = binderCue;
      line.append(mark, ' ', text);
      pair.append(line, field('Sticheron', 'cue'));
      $('.verses', panel).append(pair);
      return text;
    }
    function createEnding(section, aposticha) {
      for (const mode of ['separate', 'combined']) {
        const group = document.createElement('div');
        group.className = 'rows'; group.dataset.mode = mode;
        group.hidden = mode === 'combined';
        const cue = aposticha ? 'Sticheron' : '…';
        if (mode === 'separate') {
          group.append(field('Glory in the ' + (aposticha ? '2nd' : '1st') + ' Tone, Glory to the Father…'), field(cue, 'cue'),
            field('Now and ever, the Stavrotheotokion in the same tone, Now and ever…'));
        } else { group.append(field('Glory, Now and ever...')); }
        group.append(field(aposticha ? 'Sticheron; then “Lord, now lettest…”' : '…', 'cue'));
        section.append(group);
      }
    }
    function buildPanel(day) {
      const panel = document.createElement('article');
      panel.className = 'panel';
      panel.append($('#service-template').content.cloneNode(true));
      $('.frame', panel).prepend($('.border', art).cloneNode());
      $('.day', panel).textContent = day + ' Evening';
      for (const node of all('.flow *', panel)) {
        if (!node.children.length && node.textContent) node.contentEditable = 'true';
      }
      all('.ending', panel).forEach((section, i) => createEnding(section, i === 1));
      addVerse(panel); addVerse(panel);
      for (const source of all('.divider', art)) {
        const img = source.cloneNode(); img.hidden = img.dataset.style === 'bar'; $('.ornaments', panel).append(img);
      }
      return panel;
    }
    if (!$('#sheets').children.length) {
      for (const days of [['Monday', 'Wednesday'], ['Tuesday', 'Thursday']]) {
        const sheet = document.createElement('section'); sheet.className = 'sheet';
        sheet.append(...days.map(buildPanel)); $('#sheets').append(sheet);
      }
    }
    const legacySuffixes = { 'ˢᵗ': 'st', 'ⁿᵈ': 'nd', 'ʳᵈ': 'rd', 'ᵗʰ': 'th' };

    function formatOrdinals(field) {
      // Match across inline formatting, but never across a paragraph or line break.
      const nodes = [];
      let text = '';
      function collect(parent) {
        for (const child of parent.childNodes) {
          if (child.nodeType === Node.TEXT_NODE) {
            nodes.push({ node: child, start: text.length, spans: [] });
            text += child.data;
          } else if (child.nodeType === Node.ELEMENT_NODE) {
            const boundary = /^(BR|DIV|P|LI)$/.test(child.tagName);
            if (boundary) text += '\n';
            collect(child);
            if (boundary) text += '\n';
          }
        }
      }
      collect(field);
      for (const match of text.matchAll(/\d+(st|nd|rd|th|ˢᵗ|ⁿᵈ|ʳᵈ|ᵗʰ)(?!\w)/gi)) {
        const suffix = match[1];
        const end = match.index + match[0].length;
        const start = end - suffix.length;
        const letters = legacySuffixes[suffix] || suffix;
        for (const entry of nodes) {
          const left = Math.max(start, entry.start);
          const right = Math.min(end, entry.start + entry.node.length);
          if (left < right) entry.spans.push({
            start: left - entry.start, end: right - entry.start,
            letters: letters.slice(left - start, right - start)
          });
        }
      }

      function needsUpdate(entry) {
        const { node, spans } = entry;
        if (!node.parentElement.closest('sup.ordinal')) return spans.length > 0;
        return spans.length !== 1 || spans[0].start !== 0 ||
          spans[0].end !== node.length || node.data !== spans[0].letters;
      }
      if (!nodes.some(needsUpdate)) return;

      const selection = window.getSelection();
      function bookmark(node, offset) {
        if (!field.contains(node)) return null;
        const range = document.createRange();
        range.selectNodeContents(field);
        range.setEnd(node, offset);
        return range.toString().length;
      }
      const anchor = bookmark(selection.anchorNode, selection.anchorOffset);
      const focus = bookmark(selection.focusNode, selection.focusOffset);

      for (const sup of field.querySelectorAll('sup.ordinal')) sup.replaceWith(...sup.childNodes);
      for (const { node, spans } of nodes) {
        // Work from right to left so earlier offsets still refer to the original text.
        for (const span of spans.reverse()) {
          if (span.end < node.length) node.splitText(span.end);
          const suffix = span.start ? node.splitText(span.start) : node;
          const sup = document.createElement('sup');
          sup.className = 'ordinal';
          sup.textContent = span.letters;
          suffix.replaceWith(sup);
        }
      }
      function position(offset) {
        const walker = document.createTreeWalker(field, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
          const node = walker.currentNode;
          if (offset <= node.length) {
            const sup = node.parentElement.closest('sup.ordinal');
            if (sup && offset === node.length) {
              return [sup.parentNode, Array.prototype.indexOf.call(sup.parentNode.childNodes, sup) + 1];
            }
            return [node, offset];
          }
          offset -= node.length;
        }
        return [field, field.childNodes.length];
      }
      if (anchor !== null && focus !== null) selection.setBaseAndExtent(...position(anchor), ...position(focus));
    }
    all('#sheets [contenteditable]').forEach(formatOrdinals);
    const panels = all('.panel');
    service.replaceChildren(...panels.map((panel, i) => new Option($('.day', panel).textContent, i)));
    const selected = () => panels[service.selectedIndex];
    function syncControls() {
      const panel = selected();
      all('[data-ending]').forEach((control, i) => {
        control.value = $('[data-mode]:not([hidden])', all('.ending', panel)[i]).dataset.mode;
      });
      $('#ornament').value = $('.divider:not([hidden])', panel).dataset.style;
      $('#remove').disabled = !$('.pair', panel);
    }
    function fit(panel) {
      const frame = $('.frame', panel), flow = $('.flow', panel);
      const css = frame.style;
      const set = (name, value, unit) => css.setProperty(name, value + unit);
      const overflow = () => flow.getBoundingClientRect().bottom -
        (frame.getBoundingClientRect().bottom - parseFloat(getComputedStyle(frame).paddingBottom));
      const steps = [['--gap', limits.minGapPt, limits.maxGapPt, 'pt'],
      ['--leading', limits.minLeading, limits.maxLeading, ''],
      ['--body-size', limits.minimumPt, limits.preferredPt, 'pt']];
      for (const [name, , max, unit] of steps) set(name, max, unit);
      for (const [name, min, max, unit] of steps) {
        if (overflow() < 0.1) break;
        set(name, min, unit);
        if (overflow() > 0.1) continue;
        let lo = min, hi = max;
        for (let i = 0; i < 10; i++) {
          const mid = (lo + hi) / 2; set(name, mid, unit);
          if (overflow() > 0.1) hi = mid; else lo = mid;
        }
        set(name, lo, unit); break;
      }
      panel.toggleAttribute('data-overflow', overflow() > 0.5);
    }
    function report() {
      const bad = panels.filter(p => p.hasAttribute('data-overflow'));
      statusLine.textContent = bad.length ? 'Text exceeds the frame in ' + bad.map(p => $('.day', p).textContent).join(', ') + '. Shorten the text before printing.' : 'Click any text on the sheet to edit it.';
      return !bad.length;
    }
    function refresh() { panels.forEach(fit); return report(); }
    service.onchange = () => { syncControls(); selected().scrollIntoView({ block: 'nearest' }); };
    $('#sheets').addEventListener('focusin', e => {
      service.selectedIndex = panels.indexOf(e.target.closest('.panel')); syncControls();
    });
    $('#sheets').addEventListener('compositionend', e => {
      formatOrdinals(e.target);
      fit(e.target.closest('.panel')); report();
    });
    let dirty = false;
    const sheets = $('#sheets');
    const boldButton = $('#bold');
    let lastTextRange = null;
    function editableAt(node) {
      const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
      const field = element?.closest('[contenteditable="true"]');
      return field && sheets.contains(field) ? field : null;
    }
    function guideRange() {
      const selection = window.getSelection();
      if (!selection.rangeCount) return null;
      const range = selection.getRangeAt(0);
      const field = editableAt(range.startContainer);
      return field && field.contains(range.endContainer) ? range : null;
    }
    document.addEventListener('selectionchange', () => {
      const range = guideRange();
      if (range) lastTextRange = range.cloneRange();
      else if (document.activeElement !== boldButton) lastTextRange = null;
    });
    function toggleBold(range) {
      if (!range) return;
      const field = editableAt(range.startContainer);
      if (!field || !field.contains(range.endContainer) || !field.getClientRects().length) return;
      const saved = range.cloneRange();
      field.focus({ preventScroll: true });
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(saved);
      document.execCommand('bold');
    }
    boldButton.addEventListener('mousedown', event => event.preventDefault());
    boldButton.addEventListener('click', () => toggleBold(guideRange() || lastTextRange));
    sheets.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && !event.altKey && !event.shiftKey &&
        event.key.toLowerCase() === 'b') {
        event.preventDefault();
        toggleBold(guideRange());
      }
    });
    // Keep pasted material in the guide's own typeface, colors and sizing.
    sheets.addEventListener('paste', event => {
      if (!editableAt(event.target)) return;
      event.preventDefault();
      const text = event.clipboardData.getData('text/plain');
      if (text) document.execCommand('insertText', false, text);
    });

    $('#sheets').addEventListener('input', e => {
      dirty = true; const panel = e.target.closest('.panel');
      if (!e.isComposing) formatOrdinals(e.target);
      if (e.target.matches('.verse-text')) colorVerse(e.target);
      service.options[panels.indexOf(panel)].textContent = $('.day', panel).innerText || 'Untitled service';
      fit(panel); report();
    });
    function changed() { dirty = true; syncControls(); fit(selected()); report(); }
    for (const control of all('[data-ending]')) control.onchange = () => {
      const section = all('.ending', selected())[Number(control.dataset.ending)];
      for (const group of section.children) group.hidden = group.dataset.mode !== control.value;
      changed();
    };
    $('#ornament').onchange = () => {
      for (const img of all('.divider', selected())) img.hidden = img.dataset.style !== $('#ornament').value;
      changed();
    };
    $('#add').onclick = () => { const edit = addVerse(selected()); changed(); edit.focus(); edit.scrollIntoView({ block: 'nearest' }); };
    $('#remove').onclick = () => {
      if (confirm('Remove the last Aposticha verse and its sticheron from this service?')) {
        $('.verses', selected()).lastElementChild.remove(); changed();
      }
    };
    $('#save').onclick = () => {
      const copy = document.documentElement.cloneNode(true);
      const url = URL.createObjectURL(new Blob(['<!doctype html>\n', copy.outerHTML], { type: 'text/html;charset=utf-8' }));
      const link = document.createElement('a'); link.href = url; link.download = 'Evening-service-guides.html'; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 30000); dirty = false;
    };
    // Reserve each ornament's aspect ratio in the markup and recheck after loading.
    $('#sheets').addEventListener('load', event => {
      if (event.target.matches('img.divider')) {
        fit(event.target.closest('.panel'));
        report();
      }
    }, true);
    $('#print').onclick = async () => { await document.fonts.ready; if (refresh()) window.print(); else alert(statusLine.textContent); };
    window.addEventListener('beforeprint', refresh);
    window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
    syncControls(); refresh(); document.fonts.ready.then(refresh);
  </script>
</body>
